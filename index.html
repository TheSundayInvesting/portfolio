<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sunday Investing Terminal – Read-Only</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&family=Bebas+Neue&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:    #0a0b0e;
      --bg1:   #0d0f13;
      --bg2:   #111318;
      --card:  #12141a;
      --bord:  #1e2130;
      --cyan:  #00d4ff;
      --grn:   #00e396;
      --red:   #ff4560;
      --gold:  #f0b429;
      --t1:    #e8eaf0;
      --t2:    #7b82a0;
      --t3:    #3d4260;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--t1);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
    }
    .app { height: 100%; display: flex; flex-direction: column; }
    .topbar {
      height: 48px;
      background: var(--bg1);
      border-bottom: 1px solid var(--bord);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
      flex-shrink: 0;
    }
    .brand { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--cyan); }
    .notice {
      font-size: 11px;
      color: var(--gold);
      background: rgba(240,180,41,0.08);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(240,180,41,0.3);
    }
    .main { flex: 1; padding: 16px; overflow: auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--bord);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h2 { color: var(--cyan); margin-bottom: 12px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; text-align: right; border-bottom: 1px solid var(--bord); }
    th { color: var(--t2); font-size: 11px; text-transform: uppercase; }
    .positive { color: var(--grn); }
    .negative { color: var(--red); }
    .footer-notice {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 10px;
      color: var(--t3);
      background: var(--bg1);
      padding: 6px 12px;
      border: 1px solid var(--bord);
      border-radius: 4px;
      z-index: 100;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">Sunday Investing Terminal</div>
    <div class="notice">READ-ONLY CENTRALIZED VIEW</div>
  </div>

  <div class="main">
    <div class="card">
      <h2>Portfolio Holdings</h2>
      <table id="holdings-table">
        <thead>
          <tr>
            <th style="text-align:left">Ticker / Name</th>
            <th>Qty</th>
            <th>Avg Price</th>
            <th>Current</th>
            <th>Value</th>
            <th>Day %</th>
            <th>Total %</th>
          </tr>
        </thead>
        <tbody id="holdings-body"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Summary</h2>
      <div id="summary"></div>
    </div>
  </div>

  <div class="footer-notice">
    Data source: <code>holdings.json</code> & <code>prices.json</code> • Edit via GitHub repo
  </div>
</div>

<script>
// ────────────────────────────────────────────────
//  READ-ONLY CENTRALIZED DASHBOARD
// ────────────────────────────────────────────────

const DATA_REPO = location.hostname; // auto-detects yourusername.github.io
const HOLDINGS_URL = `https://raw.githubusercontent.com/${DATA_REPO.split('.')[0]}/${DATA_REPO}/main/holdings.json`;
const PRICES_URL   = `https://raw.githubusercontent.com/${DATA_REPO.split('.')[0]}/${DATA_REPO}/main/prices.json`;

let holdings = [];
let prices = {};

async function loadData() {
  try {
    const [hRes, pRes] = await Promise.all([
      fetch(HOLDINGS_URL + '?t=' + Date.now()),
      fetch(PRICES_URL   + '?t=' + Date.now())
    ]);

    if (hRes.ok) {
      const data = await hRes.json();
      holdings = data.holdings || [];
    }

    if (pRes.ok) {
      const data = await pRes.json();
      prices = data.prices || {};
    }

    render();
  } catch (err) {
    document.getElementById('summary').innerHTML = '<div style="color:#ff4560">Error loading data</div>';
    console.error(err);
  }
}

function render() {
  const tbody = document.getElementById('holdings-body');
  tbody.innerHTML = '';

  let totalValue = 0;
  let totalCost  = 0;

  holdings.forEach(h => {
    const p = prices[h.ticker] || {};
    const current = p.price ?? 0;
    const value   = h.qty * current;
    const cost    = h.qty * h.avgPrice;
    const dayChg  = p.dailyPct ?? 0;
    const totalChg = cost ? (value - cost) / cost : 0;

    totalValue += value;
    totalCost  += cost;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align:left">
        <strong>${h.ticker}</strong><br>
        <span style="color:#7b82a0;font-size:11px">${h.name || ''}</span>
      </td>
      <td>${h.qty.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4})}</td>
      <td>$${h.avgPrice.toFixed(2)}</td>
      <td>$${current.toFixed(2)}</td>
      <td>$${value.toLocaleString(undefined,{minimumFractionDigits:0})}</td>
      <td class="${dayChg>=0?'positive':'negative'}">${dayChg.toFixed(2)}%</td>
      <td class="${totalChg>=0?'positive':'negative'}">${(totalChg*100).toFixed(2)}%</td>
    `;
    tbody.appendChild(tr);
  });

  const pnl = totalValue - totalCost;
  const pnlPct = totalCost ? (pnl / totalCost) * 100 : 0;

  document.getElementById('summary').innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:14px;">
      <div>
        <div style="color:#7b82a0;font-size:11px">TOTAL VALUE</div>
        <div style="font-size:24px;font-weight:600">$${totalValue.toLocaleString()}</div>
      </div>
      <div>
        <div style="color:#7b82a0;font-size:11px">TOTAL P&L</div>
        <div style="font-size:24px;font-weight:600" class="${pnl>=0?'positive':'negative'}">
          ${pnl>=0?'+':'−'}$${Math.abs(pnl).toLocaleString()} (${pnlPct.toFixed(2)}%)
        </div>
      </div>
    </div>
  `;
}

// Auto-refresh every 5 minutes
setInterval(loadData, 300_000);
loadData();

</script>
</body>
</html>
