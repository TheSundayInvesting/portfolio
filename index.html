<script>
// ────────────────────────────────────────────────
// CONFIG – your holdings (edit here)
// ticker: Finnhub/Yahoo-compatible symbol (e.g. AAPL, VTI, SCHB, TSLA, BTCUSD= for crypto)
// qty: number of shares/units
// avgPrice: your average cost (optional, for P&L)
// alloc: approximate weight % (for display)
// ────────────────────────────────────────────────
const holdingsData = [
  { ticker: "SCHB", qty: 1200, avgPrice: 24.50, alloc: 43.0 },
  { ticker: "SCHF", qty: 950,  avgPrice: 22.80, alloc: 19.5 },
  { ticker: "VWO",  qty: 320,  avgPrice: 48.10, alloc: 9.4  },
  { ticker: "VTI",  qty: 85,   avgPrice: 310.00,alloc: 2.2  },
  { ticker: "AAPL", qty: 45,   avgPrice: 180.00,alloc: 6.5  },
  { ticker: "MSFT", qty: 18,   avgPrice: 380.00,alloc: 5.1  },
  // Add your real positions here...
];

// ────────────────────────────────────────────────
// YOUR FINNHUB KEY – paste it here
// ────────────────────────────────────────────────
const FINNHUB_API_KEY = "d6ev8e1r01qvn4o1788gd6ev8e1r01qvn4o17890";  // ← replace with your actual key

// ────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────
let prices = {};           // { "AAPL": {price: 225.4, change: 1.2, changePct: 0.53} }
let lastUpdateTime = null;

// ────────────────────────────────────────────────
// HELPERS
// ────────────────────────────────────────────────
function formatPrice(n) {
  return n != null ? n.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}) : "—";
}

function formatChange(n) {
  if (n == null) return "—";
  const sign = n >= 0 ? "+" : "";
  return sign + n.toFixed(2);
}

function formatPct(n) {
  if (n == null) return "—";
  const sign = n >= 0 ? "+" : "";
  return sign + n.toFixed(2) + "%";
}

function getClassForChange(n) {
  if (n == null) return "";
  return n >= 0 ? "gain" : "loss";
}

// ────────────────────────────────────────────────
// FETCH LIVE PRICES FROM FINNHUB (one request per symbol)
// ────────────────────────────────────────────────
async function fetchLivePrices() {
  const promises = holdingsData.map(async (h) => {
    const url = `https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(h.ticker)}&token=${FINNHUB_API_KEY}`;
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status} for ${h.ticker}`);
      const data = await response.json();
      
      // Finnhub quote fields: c = current, d = change, dp = % change, pc = prev close
      if (data.c != null && data.c !== 0) {
        prices[h.ticker] = {
          price:     data.c,
          change:    data.d,
          changePct: data.dp
        };
      } else {
        console.warn(`No valid quote for ${h.ticker}`, data);
      }
    } catch (err) {
      console.error(`Fetch failed for ${h.ticker}:`, err);
    }
  });

  await Promise.all(promises);

  lastUpdateTime = new Date();
  renderHoldings();
  updateSummary();
  updateTimestamp();
}

function updateTimestamp() {
  if (!lastUpdateTime) return;
  const now = new Date();
  const diffSec = Math.round((now - lastUpdateTime) / 1000);
  let text = "just now";
  if (diffSec > 90) text = Math.round(diffSec / 60) + " min ago";
  document.getElementById("last-update").textContent = `Last update: ${text}`;
}

// ────────────────────────────────────────────────
// RENDER HOLDINGS TABLE
// ────────────────────────────────────────────────
function renderHoldings() {
  const tbody = document.getElementById("holdings-body");
  tbody.innerHTML = "";

  holdingsData.forEach(h => {
    const p = prices[h.ticker] || {};
    const current   = p.price ?? null;
    const chg       = p.change ?? null;
    const chgPct    = p.changePct ?? null;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${h.ticker}</td>
      <td>$${formatPrice(current)}</td>
      <td class="${getClassForChange(chg)}">${formatChange(chg)}</td>
      <td class="${getClassForChange(chgPct)}">${formatPct(chgPct)}</td>
      <td>${h.alloc}%</td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById("position-count").textContent = holdingsData.length;
}

// ────────────────────────────────────────────────
// SIMPLE SUMMARY (portfolio value, today change)
// ────────────────────────────────────────────────
function updateSummary() {
  let totalValue = 0;
  let totalTodayChange = 0;

  holdingsData.forEach(h => {
    const p = prices[h.ticker] || {};
    if (p.price != null) {
      const value = h.qty * p.price;
      totalValue += value;
      // Approximate today's $ change (qty * daily change)
      if (p.change != null) {
        totalTodayChange += h.qty * p.change;
      }
    }
  });

  const formattedValue = totalValue.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  const changeSign = totalTodayChange >= 0 ? "+" : "";
  const changeClass = totalTodayChange >= 0 ? "gain" : "loss";

  document.getElementById("portfolio-value").textContent = `$${formattedValue}`;
  document.getElementById("today-change").textContent = `${changeSign}$${Math.abs(totalTodayChange).toFixed(2)}`;
  document.getElementById("today-change").className = `value-big ${changeClass}`;

  // Optional: total return % could be calculated if you store cost basis more precisely
}

// ────────────────────────────────────────────────
// CLOCK & TICKER (fake for now)
// ────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("en-US", {
    hour12: true,
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit"
  }) + " PT";
}

setInterval(updateClock, 1000);
updateClock();

// Fake ticker scroll content (you can make it dynamic later)
document.getElementById("ticker-content").innerHTML = `
  SCHB 26.89 <span class="loss">-0.86</span> -0.21%  •
  SCHF 25.40 <span class="gain">+0.63</span> +0.62%  •
  VWO 55.51 <span class="gain">+0.38</span> +0.69%  •
  VTI 333.51 <span class="loss">-0.79</span> -0.23%  •
  NVDA +1.16%  META +1.03%  TSLA -2.15%
`;

// ────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────
fetchLivePrices();                    // Load once on page open
setInterval(fetchLivePrices, 60000);  // Refresh every 60 seconds
</script>
